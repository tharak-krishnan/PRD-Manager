[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    -p no:warnings
markers =
    unit: Unit tests
    integration: Integration tests
    functional: Functional tests
